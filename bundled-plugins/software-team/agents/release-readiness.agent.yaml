schemaVersion: 1
agent:
  id: bundled.software-team.release-readiness.local
  name: Release Readiness Reviewer
  version: 0.1.0
  description: Reviews local release evidence and produces operator-reviewed readiness notes.
  capabilities:
    - release.review
  inputs:
    releaseName:
      type: string
      required: true
    scope:
      type: markdown
      required: false
    evidence:
      type: markdown
      required: false
    memoryContext:
      type: markdown
      required: false
  outputs:
    mode: flexible
    artifacts:
      - key: readinessNotes
        label: Readiness notes
        kind: primary
        format: markdown
  implementation:
    type: local-command
    command: node
    args:
      - scripts/software-team-runner.mjs
      - release-readiness
  runtime:
    preferredBackend: local-process
    workingDirectory: .
  permissions:
    network: deny
    filesystem: scoped
    shell: allow
    credentials: deny
    durableMemory:
      read:
        namespaces:
          - software-team/*
        maxSensitivity: internal
        reason: Read remembered release conventions when durable memory is configured.
      propose:
        namespaces:
          - software-team/*
        maxSensitivity: internal
        reason: Propose recurring release-readiness guidance for operator review.
  limits:
    maxRuntimeSeconds: 30
    maxToolCalls: 0
  observability:
    mode: inspectable
    eventHints:
      - fixture.release-readiness
  compatibility:
    teamOrchestrator: ">=0.1.0"
    pluginApi: team-orchestrator.manifests.v1
  ui:
    icon: clipboard-check
    color: "#246b5b"
    inputOrder:
      - releaseName
      - scope
      - evidence
      - memoryContext

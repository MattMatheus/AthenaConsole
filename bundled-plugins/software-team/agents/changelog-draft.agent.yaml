schemaVersion: 1
agent:
  id: bundled.software-team.changelog-draft.local
  name: Changelog Drafter
  version: 0.1.0
  description: Drafts changelog and release-note material from local release evidence.
  capabilities:
    - release.notes.draft
  inputs:
    releaseName:
      type: string
      required: true
    changes:
      type: markdown
      required: false
    evidence:
      type: markdown
      required: false
    memoryContext:
      type: markdown
      required: false
  outputs:
    mode: flexible
    artifacts:
      - key: changelogDraft
        label: Changelog draft
        kind: primary
        format: markdown
  implementation:
    type: local-command
    command: node
    args:
      - scripts/software-team-runner.mjs
      - changelog
  runtime:
    preferredBackend: local-process
    workingDirectory: .
  permissions:
    network: deny
    filesystem: scoped
    shell: allow
    credentials: deny
    durableMemory:
      read:
        namespaces:
          - software-team/*
        maxSensitivity: internal
        reason: Read prior release-note conventions when durable memory is configured.
  limits:
    maxRuntimeSeconds: 45
    maxToolCalls: 0
  observability:
    mode: inspectable
  compatibility:
    teamOrchestrator: ">=0.1.0"
    pluginApi: team-orchestrator.manifests.v1
  ui:
    icon: notebook-pen
    color: "#246b5b"
    inputOrder:
      - releaseName
      - changes
      - evidence
      - memoryContext

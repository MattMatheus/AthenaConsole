schemaVersion: 1
plugin:
  id: team-orchestrator.bundled.software-team
  name: Software Team Pack
  version: 0.1.0
  description: First-party bundled capability pack for local and AthenaAgent-powered software-team repository work.
  pack:
    category: software-team
    maturity: preview
    credentialRequirements:
      - none
      - model-provider
    memoryRequirements:
      - read
      - propose
    safety:
      posture: read-only
      externalWrites: false
      notes: Deterministic bundled agents require no provider credentials; athena-agent.* agents are model-backed, AthenaAgent-powered, and require a configured OpenAI-compatible provider.
    exampleWorkflows:
      - path: workflows/release-readiness.workflow.yaml
        id: bundled.software-team.release-readiness.workflow
        version: 0.1.0
      - path: workflows/repo-onboarding.workflow.yaml
        id: bundled.software-team.repo-onboarding.workflow
        version: 0.1.0
      - path: workflows/docs-health-check.workflow.yaml
        id: bundled.software-team.docs-health-check.workflow
        version: 0.1.0
      - path: workflows/pr-review-support.workflow.yaml
        id: bundled.software-team.pr-review-support.workflow
        version: 0.1.0
      - path: workflows/ci-failure-triage.workflow.yaml
        id: bundled.software-team.ci-failure-triage.workflow
        version: 0.1.0
    outcomes:
      - id: repo-summary
        title: Summarize a repository
        description: Use the bundled software-team pack to describe structure, risks, and next steps.
        target:
          kind: agent
          id: bundled.software-team.repo-summary.local
          version: 0.1.0
        contextRequirements:
          - repository
        expectedArtifacts:
          - label: Repository summary
            format: markdown
        executionMode: deterministic
        ui:
          icon: folder-search
          badge: Repo context
          order: 10
      - id: code-review
        title: Review code changes
        description: Start a focused code review task using an existing local repository.
        target:
          kind: agent
          id: bundled.software-team.code-review.local
          version: 0.1.0
        contextRequirements:
          - repository
        expectedArtifacts:
          - label: Code review brief
            format: markdown
        executionMode: deterministic
        ui:
          icon: search-check
          badge: Read-only
          order: 20
      - id: release-readiness
        title: Check release readiness
        description: Run the bundled release workflow to collect readiness notes and evidence.
        target:
          kind: workflow
          id: bundled.software-team.release-readiness.workflow
          version: 0.1.0
        contextRequirements:
          - release-evidence
          - repository
        expectedArtifacts:
          - label: Release notes
            format: markdown
          - label: Readiness review
            format: markdown
        executionMode: deterministic
        ui:
          icon: clipboard-check
          badge: Workflow
          order: 30
      - id: test-failure
        title: Explain a test failure
        description: Create a task that turns failure output into a concise debugging brief.
        target:
          kind: agent
          id: bundled.software-team.test-failure-explain.local
          version: 0.1.0
        contextRequirements:
          - failure-output
          - repository
        expectedArtifacts:
          - label: Failure triage brief
            format: markdown
        executionMode: deterministic
        ui:
          icon: list-checks-alt
          badge: Local analysis
          order: 40
  authors:
    - name: Team Orchestrator
  agents:
    - path: agents/repo-summary.agent.yaml
      id: bundled.software-team.repo-summary.local
      version: 0.1.0
    - path: agents/athena-agent-repo-summary.agent.yaml
      id: athena-agent.repo-summary
      version: 0.1.0
    - path: agents/athena-agent-pr-diff-review.agent.yaml
      id: athena-agent.pr-diff-review
      version: 0.1.0
    - path: agents/athena-agent-test-failure-triage.agent.yaml
      id: athena-agent.test-failure-triage
      version: 0.1.0
    - path: agents/docs-audit.agent.yaml
      id: bundled.software-team.docs-audit.local
      version: 0.1.0
    - path: agents/code-review.agent.yaml
      id: bundled.software-team.code-review.local
      version: 0.1.0
    - path: agents/test-failure-explain.agent.yaml
      id: bundled.software-team.test-failure-explain.local
      version: 0.1.0
    - path: agents/changelog-draft.agent.yaml
      id: bundled.software-team.changelog-draft.local
      version: 0.1.0
    - path: agents/release-readiness.agent.yaml
      id: bundled.software-team.release-readiness.local
      version: 0.1.0
  workflowTemplates:
    - path: workflows/repo-onboarding.workflow.yaml
      id: bundled.software-team.repo-onboarding.workflow
      version: 0.1.0
    - path: workflows/docs-health-check.workflow.yaml
      id: bundled.software-team.docs-health-check.workflow
      version: 0.1.0
    - path: workflows/pr-review-support.workflow.yaml
      id: bundled.software-team.pr-review-support.workflow
      version: 0.1.0
    - path: workflows/ci-failure-triage.workflow.yaml
      id: bundled.software-team.ci-failure-triage.workflow
      version: 0.1.0
    - path: workflows/release-readiness.workflow.yaml
      id: bundled.software-team.release-readiness.workflow
      version: 0.1.0
  docs:
    readme: docs/README.md
  compatibility:
    teamOrchestrator: ">=0.1.0"
    manifestSchema: team-orchestrator.manifests.v1
    runtimeBackends:
      - local-process
    platforms:
      - any
  permissions:
    network: deny
    filesystem: scoped
    shell: allow
    credentials: deny
    durableMemory:
      read:
        namespaces:
          - software-team/*
        maxSensitivity: internal
        reason: Read operator-approved repository conventions and prior software-team guidance when configured.
      propose:
        namespaces:
          - software-team/*
        maxSensitivity: internal
        reason: Propose recurring software-team guidance for operator review.
  ui:
    icon: list-checks
    color: "#246b5b"
    tags:
      - bundled
      - software-team
      - first-party

schemaVersion: 1
workflow:
  id: bundled.software-team.release-readiness.workflow
  name: Release Readiness Review
  version: 0.1.0
  description: Smokeable bundled workflow for release-readiness review conventions.
  goal: Produce deterministic release-readiness notes from local fixture inputs.
  inputs:
    releaseName:
      type: string
      label: Release Name
      required: true
    scope:
      type: markdown
      label: Scope
      required: false
      default: Review release readiness using local fixture evidence.
  tasks:
    - id: review
      title: Review release readiness
      capabilityRequirements:
        - release.review
      assignedAgentId: bundled.software-team.release-readiness.local
      assignedAgentVersion: 0.1.0
      inputs:
        releaseName: "{{ releaseName }}"
        scope: "{{ scope }}"
  ui:
    icon: list-checks
    color: "#246b5b"
    tags:
      - release
      - readiness

schemaVersion: 1
plugin:
  id: team-orchestrator.bundled.software-team-demo
  name: Software Team Demo Pack
  version: 0.1.0
  description: First-party bundled capability pack fixture for software-team workflow conventions.
  pack:
    category: software-team
    maturity: preview
    credentialRequirements:
      - none
    memoryRequirements:
      - none
    safety:
      posture: read-only
      externalWrites: false
      notes: Uses deterministic local fixtures and does not modify external systems.
    exampleWorkflows:
      - path: workflows/release-readiness.workflow.yaml
        id: bundled.software-team.release-readiness.workflow
        version: 0.1.0
  authors:
    - name: Team Orchestrator
  agents:
    - path: agents/release-readiness.agent.yaml
      id: bundled.software-team.release-readiness.local
      version: 0.1.0
  workflowTemplates:
    - path: workflows/release-readiness.workflow.yaml
      id: bundled.software-team.release-readiness.workflow
      version: 0.1.0
  docs:
    readme: docs/README.md
  compatibility:
    teamOrchestrator: ">=0.1.0"
    manifestSchema: team-orchestrator.manifests.v1
    runtimeBackends:
      - local-process
    platforms:
      - any
  permissions:
    network: deny
    filesystem: scoped
    shell: allow
    credentials: deny
  ui:
    icon: list-checks
    color: "#246b5b"
    tags:
      - bundled
      - software-team
      - fixture

services:
  deps:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: >-
      sh -c "npm install"
    volumes:
      - .:/workspace
      - ${ATHENA_REPO_HOST_PATH:-.}:${ATHENA_REPO_CONTAINER_PATH:-/workspace/target-repo}
      - athena-root-node-modules:/workspace/node_modules
      - athena-api-node-modules:/workspace/apps/api/node_modules
      - athena-core-node-modules:/workspace/packages/core/node_modules
      - athena-console-node-modules:/workspace/apps/console/node_modules

  api:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: >-
      sh -c "apt-get update &&
      apt-get install -y --no-install-recommends git &&
      rm -rf /var/lib/apt/lists/* &&
      npm run build --workspace @athena/core &&
      npm run dev --workspace @athena/api"
    environment:
      ATHENA_DEV_API_HOST: 0.0.0.0
      ATHENA_DEV_API_PORT: 8787
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      ATHENA_WORKSPACE_ROOT: /workspace
      ATHENA_LOCK_PROVIDER_DEFAULT: local
      ATHENA_DISTRIBUTED_LOCK_PROVIDER: local
      ATHENA_EXECUTION_PROVIDER_DEFAULT: docker
      ATHENA_SANDBOX_BACKEND_PROVIDER: docker
      ATHENA_SANDBOX_WORKSPACE_HOST_PATH: ${ATHENA_SANDBOX_WORKSPACE_HOST_PATH:-/workspace}
      ATHENA_STATE_DIR: .athena
    volumes:
      - .:/workspace
      - ${ATHENA_REPO_HOST_PATH:-.}:${ATHENA_REPO_CONTAINER_PATH:-/workspace/target-repo}
      - athena-root-node-modules:/workspace/node_modules
      - athena-api-node-modules:/workspace/apps/api/node_modules
      - athena-core-node-modules:/workspace/packages/core/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  console:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: >-
      sh -c "npm run dev --workspace @athena/console -- --host 0.0.0.0 --port 5173"
    environment:
      ATHENA_DEV_UI_HOST: 0.0.0.0
      ATHENA_DEV_UI_PORT: 5173
      ATHENA_DEV_API_HOST: api
      ATHENA_DEV_API_PORT: 8787
      ATHENA_DEV_PROXY_TARGET: http://api:8787
    volumes:
      - .:/workspace
      - ${ATHENA_REPO_HOST_PATH:-.}:${ATHENA_REPO_CONTAINER_PATH:-/workspace/target-repo}
      - athena-root-node-modules:/workspace/node_modules
      - athena-console-node-modules:/workspace/apps/console/node_modules
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  athena-root-node-modules:
  athena-api-node-modules:
  athena-core-node-modules:
  athena-console-node-modules:

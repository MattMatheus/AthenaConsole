schemaVersion: 1
plugin:
  id: team-orchestrator.examples.news
  name: News Workflow Examples
  version: 0.1.0
  description: Single-agent plugin for news aggregation and digest generation.
  authors:
    - name: Team Orchestrator
  agents:
    - path: agents/news-digest.agent.yaml
      id: news.digest.local
      version: 0.1.0
  docs:
    readme: docs/README.md
  compatibility:
    teamOrchestrator: ">=0.1.0"
    manifestSchema: team-orchestrator.manifests.v1
    runtimeBackends:
      - local-process
      - api
    platforms:
      - any
  permissions:
    network: read
    filesystem: scoped
    shell: allow
    containers: deny
    credentials: deny
  ui:
    icon: newspaper
    color: "#1f7a8c"
    tags:
      - news
      - digest

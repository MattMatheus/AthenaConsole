server {
  listen 80;
  server_name _;

  auth_basic "Team Orchestrator Console";
  auth_basic_user_file /etc/nginx/athena.htpasswd;

  location /api/ {
    proxy_pass http://api:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer ${ATHENA_AUTH_API_TOKEN}";
    proxy_set_header x-athena-identity "console";
    proxy_set_header x-athena-api-token "";
    proxy_buffering off;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

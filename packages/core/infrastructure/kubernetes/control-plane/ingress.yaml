apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: athena-control-plane
  namespace: athena
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.athena.teamorchestrator.com
      secretName: athena-control-plane-tls
  rules:
    - host: api.athena.teamorchestrator.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: athena-control-plane
                port:
                  number: 8787

services:
  # Mimics Azure Cache for Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Athena API Plane
  api:
    build:
      context: ../../..
      dockerfile: packages/core/infrastructure/docker/control-plane.Dockerfile
    environment:
      - ATHENA_AUTH_ENABLED=false
      - ATHENA_DISTRIBUTED_LOCK_PROVIDER=redis
      - ATHENA_REDIS_URL=redis://redis:6379
      - ATHENA_EXECUTION_BACKEND=local-exec # Use local-exec for docker-compose dev
      - ATHENA_STATE_ROOT=/athena/state
      - ATHENA_DEV_API_HOST=0.0.0.0
      - ATHENA_DEV_API_PORT=8787
    volumes:
      - ../../../.athena:/athena/state
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8787:8787"

  # Athena Web Console
  console:
    build:
      context: ../../..
      dockerfile: packages/core/infrastructure/docker/console.Dockerfile
    environment:
      - ATHENA_DEV_UI_HOST=0.0.0.0
      - ATHENA_DEV_UI_PORT=5173
      - ATHENA_DEV_API_HOST=api
      - ATHENA_DEV_API_PORT=8787
      - ATHENA_DEV_PROXY_TARGET=http://api:8787
    ports:
      - "5173:5173"
    depends_on:
      - api

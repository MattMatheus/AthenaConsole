name: Control Plane CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "infrastructure/docker/control-plane.Dockerfile"
      - "infrastructure/kubernetes/control-plane/**"
      - "infrastructure/kubernetes/ingress-nginx/**"
      - ".github/workflows/deploy-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "infrastructure/docker/control-plane.Dockerfile"
      - "infrastructure/kubernetes/control-plane/**"
      - "infrastructure/kubernetes/ingress-nginx/**"
      - ".github/workflows/deploy-control-plane.yml"
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
  IMAGE_NAME: athena-control-plane
  K8S_NAMESPACE: athena

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate And Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/console/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Console Dependencies
        working-directory: packages/console
        run: npm ci

      - name: Verify API Schemas
        run: npm run check:schemas

      - name: Typecheck Core
        run: npm run typecheck:core

      - name: Run Tests
        run: npm run test

      - name: Build Core
        run: npm run build:core

      - name: Build Control Plane Image
        run: |
          docker build \
            --file infrastructure/docker/control-plane.Dockerfile \
            --tag athena-control-plane:ci \
            .

  deploy:
    name: Deploy To AKS (Dev)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    environment: dev
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Deployment Configuration
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_AKS_NAME: ${{ vars.AZURE_AKS_NAME }}
          AZURE_CONTROL_PLANE_WORKLOAD_CLIENT_ID: ${{ vars.AZURE_CONTROL_PLANE_WORKLOAD_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0

          required_keys=(
            AZURE_ACR_NAME
            AZURE_ACR_LOGIN_SERVER
            AZURE_RESOURCE_GROUP
            AZURE_AKS_NAME
            AZURE_CONTROL_PLANE_WORKLOAD_CLIENT_ID
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
          )

          for key in "${required_keys[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required deployment configuration: ${key}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Deployment prerequisites are incomplete."
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Image Metadata
        id: meta
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          image_ref="${REGISTRY}/${IMAGE_NAME}:${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: ACR Login
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build And Push Image
        run: |
          set -euo pipefail
          docker build \
            --file infrastructure/docker/control-plane.Dockerfile \
            --tag "${{ steps.meta.outputs.image_ref }}" \
            .
          docker push "${{ steps.meta.outputs.image_ref }}"

      - name: Fetch AKS Credentials
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_AKS_NAME }}" \
            --overwrite-existing

      - name: Ensure NGINX Ingress Controller
        run: |
          set -euo pipefail
          if ! kubectl -n ingress-nginx get deployment ingress-nginx-controller >/dev/null 2>&1; then
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/cloud/deploy.yaml
          else
            echo "ingress-nginx-controller already present; skipping bootstrap apply."
          fi
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=300s

      - name: Ensure cert-manager
        run: |
          set -euo pipefail
          if ! kubectl -n cert-manager get deployment cert-manager >/dev/null 2>&1; then
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.18.2/cert-manager.yaml
          else
            echo "cert-manager already present; skipping bootstrap apply."
          fi
          kubectl -n cert-manager rollout status deployment/cert-manager --timeout=300s
          kubectl -n cert-manager rollout status deployment/cert-manager-cainjector --timeout=300s
          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=300s

      - name: Apply Kubernetes Manifests
        run: |
          set -euo pipefail
          kubectl apply -f infrastructure/kubernetes/control-plane/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/control-plane/clusterissuer-letsencrypt-prod.yaml
          kubectl apply -f infrastructure/kubernetes/control-plane/certificate.yaml
          kubectl apply -f infrastructure/kubernetes/control-plane/serviceaccount.yaml
          kubectl -n "${K8S_NAMESPACE}" annotate serviceaccount/athena-control-plane \
            azure.workload.identity/client-id="${{ vars.AZURE_CONTROL_PLANE_WORKLOAD_CLIENT_ID }}" \
            --overwrite
          kubectl apply -f infrastructure/kubernetes/control-plane/deployment.yaml
          kubectl apply -f infrastructure/kubernetes/control-plane/service.yaml
          kubectl apply -f infrastructure/kubernetes/control-plane/ingress.yaml

      - name: Check TLS Certificate Status (Best Effort)
        run: |
          set -euo pipefail
          if kubectl -n "${K8S_NAMESPACE}" wait --for=condition=Ready certificate/athena-control-plane-cert --timeout=300s; then
            echo "TLS certificate is ready."
          else
            echo "::warning::TLS certificate is not Ready yet. Verify DNS for api.athena.teamorchestrator.com points to ingress and rerun deploy."
            kubectl -n "${K8S_NAMESPACE}" get certificate,certificaterequest,order,challenge || true
          fi

      - name: Set Deployed Image
        run: |
          set -euo pipefail
          ORIGINS="${{ vars.CONTROL_PLANE_ALLOWED_ORIGINS }}"
          APPINSIGHTS_CONNECTION="${{ secrets.ATHENA_APPINSIGHTS_CONNECTION_STRING_DEV }}"
          if [ -z "${ORIGINS}" ]; then
            ORIGINS="https://athena.teamorchestrator.com"
          fi
          kubectl -n "${K8S_NAMESPACE}" set image deployment/athena-control-plane \
            athena-control-plane="${{ steps.meta.outputs.image_ref }}"
          kubectl -n "${K8S_NAMESPACE}" set env deployment/athena-control-plane \
            AZURE_CLIENT_ID="${{ vars.AZURE_CONTROL_PLANE_WORKLOAD_CLIENT_ID }}" \
            ATHENA_ALLOWED_ORIGINS="${ORIGINS}"
          if [ -n "${APPINSIGHTS_CONNECTION}" ]; then
            kubectl -n "${K8S_NAMESPACE}" set env deployment/athena-control-plane \
              ATHENA_APPINSIGHTS_ENABLED="true" \
              ATHENA_APPINSIGHTS_CONNECTION_STRING="${APPINSIGHTS_CONNECTION}"
          fi

      - name: Wait For Rollout
        run: kubectl -n "${K8S_NAMESPACE}" rollout status deployment/athena-control-plane --timeout=180s

      - name: Smoke Test API Reachability
        run: |
          set -euo pipefail
          kubectl -n "${K8S_NAMESPACE}" run athena-smoke-${{ github.run_id }} \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --rm \
            --attach \
            --command -- \
            sh -c 'curl --retry 8 --retry-connrefused --retry-delay 3 --fail --silent --show-error http://athena-control-plane:8787/api/v1/admin/health > /dev/null'

name: Console CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/console/**"
      - "package.json"
      - "package-lock.json"
      - "packages/console/package.json"
      - "packages/console/package-lock.json"
      - ".github/workflows/deploy-console.yml"
  push:
    branches: [main]
    paths:
      - "packages/console/**"
      - "package.json"
      - "package-lock.json"
      - "packages/console/package.json"
      - "packages/console/package-lock.json"
      - ".github/workflows/deploy-console.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Console Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CONSOLE_PASSWORD: ${{ vars.CONSOLE_LOGIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/console/package-lock.json

      - name: Install Dependencies
        working-directory: packages/console
        run: npm ci

      - name: Typecheck Console
        working-directory: packages/console
        run: npm run typecheck

      - name: Build Console
        working-directory: packages/console
        run: npm run build

  deploy:
    name: Deploy Console To Azure SWA (Dev)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    environment: dev
    timeout-minutes: 20
    env:
      VITE_CONSOLE_PASSWORD: ${{ vars.CONSOLE_LOGIN_PASSWORD != '' && vars.CONSOLE_LOGIN_PASSWORD || secrets.CONSOLE_LOGIN_PASSWORD }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/console/package-lock.json

      - name: Require Console Password
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN_DEV: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_CONSOLE_PASSWORD}" ]; then
            echo "Missing CONSOLE_LOGIN_PASSWORD (repo/env variable or secret). Refusing unprotected deploy."
            exit 1
          fi
          if [ -z "${AZURE_STATIC_WEB_APPS_API_TOKEN_DEV}" ]; then
            echo "Missing AZURE_STATIC_WEB_APPS_API_TOKEN_DEV secret. Refusing deploy."
            exit 1
          fi

      - name: Build Console Artifact
        working-directory: packages/console
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Deploy To Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: upload
          app_location: packages/console/dist
          skip_app_build: true
